<article  class="taon-md-doc"><h1 id="npm-yarn-install-packages" translate="" [translate-t]="t">npm yarn install/packages</h1>
<ul>
<li>do NOT install ANYTHING from package.json</li>
<li>do NOT install new npm/yarn packages</li>
<li>do not use npm install or yarn add</li>
<li>don't change package.json or any files except from /src folder</li>
<li>don't change node_modules</li>
</ul>
